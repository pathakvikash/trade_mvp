# Render's free web service sleeps after ~15 min idle, which pauses limit orders, TP/SL and liquidations.
# A ping every 5 min keeps it awake. ponytail: GitHub cron can lag 5-15 min and pauses after 60 days of repo inactivity; use cron-job.org if that bites.
name: keepalive
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --max-time 60 https://cryptozen-api.onrender.com/api/health
      # Best effort: a failure here must not fail the workflow.
      # Through the Vercel rewrite: also warns a cold Render before Orrery calls it.
      - run: curl -sS --max-time 60 -o /dev/null https://trade-mvp.vercel.app/.well-known/orrery-app.json || true
